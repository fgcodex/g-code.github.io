<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.Code | Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            max-width: 650px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .window-buttons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

       
        .main-logo {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 70px;
            height: 70px;
            mix-blend-mode: screen;
            object-fit: contain;
        }

        .prompt { color: #58a6ff; font-weight: bold; }

        .command {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #58a6ff;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        p { line-height: 1.6; font-size: 0.95rem; margin: 8px 0 20px 0; }

        .tech-icons {
            display: flex;
            gap: 24px;
            align-items: center;
            justify-content: center;
            margin: 12px 0 25px 0;
            flex-wrap: wrap;
        }

        .tech-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: #8b949e;
        }

        .tech-label img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .tech-label:hover img { filter: brightness(1.4); }
        .tech-label:hover { color: #c9d1d9; }

        .project-links {
            display: flex;
            gap: 30px;
            margin: 12px 0 25px 0;
            align-items: center;
            justify-content: center;
        }

        .project-links a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #8b949e;
            font-size: 0.7rem;
            transition: color 0.2s;
        }

        .project-links a:hover { color: #c9d1d9; }

        .project-links img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .project-links a:hover img { filter: brightness(1.3); }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            text-decoration: none;
            border: 1px solid #5865F2;
            padding: 10px 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: transparent;
        }

        .discord-btn:hover {
            background: #5865F2;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
        }

        .discord-btn img {
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="window-buttons">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>

        
        <img src="logo.png" alt="G.Code" class="main-logo">

        <br><br>

        <div><span class="prompt">></span> <span class="command">About_me</span></div>
        <p>
            <strong>G.Code | 16yo Dev</strong><br>
            Multi-skilled in Luau, Python, 3D Modeling &amp; Animation.
        </p>

        <div class="tech-icons">
            <div class="tech-label">
                <img src="https://cdn.simpleicons.org/roblox/ffffff" alt="Luau">
                <span>Luau</span>
            </div>
            <div class="tech-label">
                <img src="https://cdn.simpleicons.org/python/3776AB" alt="Python">
                <span>Python</span>
            </div>
            <div class="tech-label">
                <img src="https://cdn.simpleicons.org/blender/E87D0D" alt="3D">
                <span>3D</span>
            </div>
            <div class="tech-label">
                <!-- Cambiado a Cinema4D que sí carga bien -->
                <img src="https://cdn.simpleicons.org/unrealengine/ffffff" alt="Animation">
                <span>Animation</span>
            </div>
        </div>

        <div><span class="prompt">></span> <span class="command">projects</span></div>
        <div class="project-links">
            <a href="https://www.youtube.com/@helloworldx64" target="_blank">
                <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube">
                <span>Showcases</span>
            </a>
            <a href="https://github.com/fgcodex" target="_blank">
                <img src="https://cdn.simpleicons.org/github/ffffff" alt="GitHub">
                <span>Libraries</span>
            </a>
        </div>

        <div><span class="prompt">></span> <span class="command">contact --status:open</span> <span class="cursor"></span></div>

        <a href="https://discord.com/users/1479682746594099201" target="_blank" class="discord-btn">
            <img src="https://cdn.simpleicons.org/discord/5865F2" alt="Discord">
        </a>
    </div>

</body>
</html>
